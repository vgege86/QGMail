name: Build & Deploy Package

on:
  push:
    branches: ["**"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build backend
        run: |
          cd backend
          npm ci
          npm run build

      - name: Install backend production deps
        run: |
          cd backend
          npm ci --omit=dev

      - name: Create deployment package
        run: |
          mkdir -p qgmail-deploy/public
          cp -r backend/dist/* qgmail-deploy/
          cp -r backend/node_modules qgmail-deploy/
          cp backend/package.json qgmail-deploy/
          cp -r frontend/dist/* qgmail-deploy/public/
          cp .env.example qgmail-deploy/.env.example
          cat > qgmail-deploy/start.sh << 'EOF'
          #!/bin/sh
          # QGMail — script de inicio
          # Edita .env antes de ejecutar este script
          if [ ! -f .env ]; then
            cp .env.example .env
            echo "⚠️  Crea el archivo .env con tus credenciales antes de continuar."
            exit 1
          fi
          export $(grep -v '^#' .env | xargs)
          mkdir -p sessions
          node index.js
          EOF
          chmod +x qgmail-deploy/start.sh
          zip -r qgmail-deploy.zip qgmail-deploy/

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: qgmail-deploy
          path: qgmail-deploy.zip
          retention-days: 30

  build-and-push-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (for ARM64 cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
